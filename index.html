<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Erlangga Haryo Pangestu — mahasiswa TRPL & web developer. Kumpulan proyek, pengalaman, dan kontak." />
  <meta name="theme-color" content="#f6f2ea" />
  <!-- Pasang tema sebelum halaman digambar, supaya tidak berkedip.
       Urutan: pilihan terakhir pengunjung → pengaturan HP/laptop. -->
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#151412' : '#f6f2ea';
    })();
  </script>
  <meta property="og:title" content="Erlangga Haryo Pangestu — Portofolio" />
  <meta property="og:description" content="Web developer & mahasiswa TRPL Politeknik Negeri Subang." />
  <meta property="og:image" content="assets/img/profile.jpg" />
  <title>Erlangga Haryo Pangestu — Portofolio</title>

  <link rel="icon" href="assets/img/profile.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

    Buka lewat Laragon: http://erlangga-portofolio.test

    Mau tambah proyek? Edit partials/projects.html.
  -->
